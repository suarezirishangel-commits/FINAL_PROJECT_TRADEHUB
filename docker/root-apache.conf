<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/config>
    Require all denied
</Directory>

<Directory /var/www/html/includes>
    Require all denied
</Directory>

<Directory /var/www/html/vendor>
    Require all denied
</Directory>

<FilesMatch "^(composer\.(json|lock)|README\.md)$">
    Require all denied
</FilesMatch>
